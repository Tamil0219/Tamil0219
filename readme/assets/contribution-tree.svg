<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071A12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050505;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="80" fill="url(#footerGrad)"/>

  <!-- Growing tree from bottom center -->
  <g transform="translate(450, 80)">
    <!-- Trunk -->
    <rect x="-4" y="-45" width="8" height="45" rx="3" fill="#7A4E2D" opacity="0.7"/>
    <!-- Canopy layers -->
    <ellipse cx="0" cy="-50" rx="30" ry="20" fill="#0B3D2E" opacity="0.7"/>
    <ellipse cx="-18" cy="-60" rx="18" ry="14" fill="#0B3D2E" opacity="0.6"/>
    <ellipse cx="20" cy="-58" rx="16" ry="13" fill="#0B3D2E" opacity="0.6"/>
    <!-- Glowing tips -->
    <circle cx="-22" cy="-72" r="4" fill="#3FA34D" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="-70" r="3.5" fill="#3FA34D" filter="url(#glow)" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="-68" r="4" fill="#7ED957" filter="url(#glow)" opacity="1">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Rising particles -->
    <circle cx="-3" cy="-50" r="1.5" fill="#7ED957">
      <animate attributeName="cy" values="-50;-80;-50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="3" cy="-55" r="1" fill="#FFD700">
      <animate attributeName="cy" values="-55;-85;-55" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Roots spreading from base -->
  <g stroke="#3FA34D" stroke-width="1.2" fill="none" opacity="0.35">
    <path d="M450,80 Q370,80 300,80"/>
    <path d="M450,80 Q530,80 600,80"/>
    <path d="M450,80 Q410,78 350,80"/>
    <path d="M450,80 Q490,78 550,80"/>
  </g>

  <!-- Footer text -->
  <text x="450" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#7ED957" letter-spacing="2" filter="url(#glow)">
    🌱 Keep Growing. Keep Building.
  </text>

  <!-- Subtle scanline effect -->
  <line x1="200" y1="35" x2="390" y2="35" stroke="#3FA34D" stroke-width="0.5" opacity="0.2"/>
  <line x1="510" y1="35" x2="700" y2="35" stroke="#3FA34D" stroke-width="0.5" opacity="0.2"/>

  <!-- Left tree mini -->
  <g transform="translate(160, 65)" opacity="0.3">
    <rect x="-2" y="-20" width="4" height="20" rx="1" fill="#7A4E2D"/>
    <ellipse cx="0" cy="-22" rx="12" ry="9" fill="#0B3D2E"/>
    <circle cx="0" cy="-30" r="2" fill="#3FA34D"/>
  </g>
  <!-- Right tree mini -->
  <g transform="translate(740, 65)" opacity="0.3">
    <rect x="-2" y="-20" width="4" height="20" rx="1" fill="#7A4E2D"/>
    <ellipse cx="0" cy="-22" rx="12" ry="9" fill="#0B3D2E"/>
    <circle cx="0" cy="-30" r="2" fill="#3FA34D"/>
  </g>
</svg>
