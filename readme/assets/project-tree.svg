<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071A12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#050505;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="120" fill="url(#bgG)" rx="8"/>
  <rect width="900" height="120" fill="none" stroke="#3FA34D" stroke-width="1" rx="8" opacity="0.3"/>

  <!-- Stars -->
  <circle cx="80" cy="25" r="1.2" fill="#FFD700" opacity="0.7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="15" r="1" fill="#7ED957" opacity="0.6"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="20" r="1.2" fill="#FFD700" opacity="0.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="30" r="1" fill="#7ED957" opacity="0.5"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.1s" repeatCount="indefinite"/></circle>

  <!-- Tree icon left side -->
  <g transform="translate(80, 40)" opacity="0.7">
    <rect x="-3" y="20" width="6" height="40" rx="2" fill="#7A4E2D"/>
    <ellipse cx="0" cy="15" rx="16" ry="22" fill="#0B3D2E"/>
    <ellipse cx="-8" cy="8" rx="10" ry="14" fill="#0B3D2E"/>
    <ellipse cx="10" cy="10" rx="9" ry="12" fill="#0B3D2E"/>
    <circle cx="-12" cy="6" r="3" fill="#3FA34D" filter="url(#glow)" opacity="0.8"/>
    <circle cx="12" cy="8" r="2.5" fill="#3FA34D" filter="url(#glow)" opacity="0.8"/>
    <circle cx="0" cy="-5" r="3" fill="#7ED957" filter="url(#glow)" opacity="0.9"/>
  </g>

  <!-- Tree icon right side -->
  <g transform="translate(820, 40)" opacity="0.7">
    <rect x="-3" y="20" width="6" height="40" rx="2" fill="#7A4E2D"/>
    <ellipse cx="0" cy="15" rx="16" ry="22" fill="#0B3D2E"/>
    <ellipse cx="-8" cy="8" rx="10" ry="14" fill="#0B3D2E"/>
    <ellipse cx="10" cy="10" rx="9" ry="12" fill="#0B3D2E"/>
    <circle cx="-12" cy="6" r="3" fill="#3FA34D" filter="url(#glow)" opacity="0.8"/>
    <circle cx="12" cy="8" r="2.5" fill="#3FA34D" filter="url(#glow)" opacity="0.8"/>
    <circle cx="0" cy="-5" r="3" fill="#7ED957" filter="url(#glow)" opacity="0.9"/>
  </g>

  <!-- Journey path -->
  <g font-family="monospace" font-size="11" fill="#3FA34D" text-anchor="middle">
    <!-- Seeds/stages along a winding path -->
    <text x="150" y="55" fill="#7ED957" font-size="18">🌱</text>
    <text x="150" y="75" fill="#3FA34D" font-size="10">SEED</text>

    <text x="290" y="45" fill="#3FA34D" font-size="14">↓</text>

    <text x="290" y="55" fill="#7ED957" font-size="18">🌿</text>
    <text x="290" y="75" fill="#3FA34D" font-size="10">ROOTS</text>

    <text x="390" y="45" fill="#3FA34D" font-size="14">↓</text>

    <text x="390" y="55" fill="#7ED957" font-size="18">🌳</text>
    <text x="390" y="75" fill="#3FA34D" font-size="10">GROWTH</text>

    <text x="490" y="45" fill="#3FA34D" font-size="14">↓</text>

    <text x="490" y="55" fill="#7ED957" font-size="18">💻</text>
    <text x="490" y="75" fill="#3FA34D" font-size="10">CODE</text>

    <text x="590" y="45" fill="#3FA34D" font-size="14">↓</text>

    <text x="590" y="55" fill="#7ED957" font-size="18">🤖</text>
    <text x="590" y="75" fill="#3FA34D" font-size="10">AI</text>

    <text x="680" y="45" fill="#3FA34D" font-size="14">↓</text>

    <text x="680" y="55" fill="#FFD700" font-size="18">🚀</text>
    <text x="680" y="75" fill="#FFD700" font-size="10">FUTURE</text>
  </g>

  <!-- Connecting line through stages -->
  <line x1="150" y1="90" x2="750" y2="90" stroke="#3FA34D" stroke-width="1" stroke-dasharray="4,6" opacity="0.3"/>

  <!-- Ambient glow pulse -->
  <ellipse cx="450" cy="60" rx="300" ry="40" fill="#0B3D2E" opacity="0.1">
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Top label -->
  <text x="450" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#3FA34D" letter-spacing="4" opacity="0.7">✦ THE DEVELOPER'S JOURNEY ✦</text>

  <!-- Bottom label -->
  <text x="450" y="110" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#7A4E2D" letter-spacing="2" opacity="0.6">BUILD · LEARN · IMPROVE · REPEAT</text>
</svg>
