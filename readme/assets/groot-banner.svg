<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071A12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0B3D2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050505;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Leaf shape -->
    <path id="leaf" d="M0,-8 C4,-6 6,0 0,8 C-6,0 -4,-6 0,-8Z"/>
    <!-- Particle animation -->
    <animate id="floatAnim" attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <!-- Stars / particles -->
  <g opacity="0.6">
    <circle cx="50" cy="20" r="1" fill="#7ED957"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="45" r="1.5" fill="#FFD700"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="15" r="1" fill="#7ED957"><animate attributeName="opacity" values="0.5;1;0.5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="30" r="1" fill="#7ED957"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="12" r="1.5" fill="#FFD700"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="40" r="1" fill="#3FA34D"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="18" r="1" fill="#7ED957"><animate attributeName="opacity" values="0.6;1;0.6" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="35" r="1.5" fill="#FFD700"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="22" r="1" fill="#7ED957"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="48" r="1" fill="#3FA34D"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="70" r="1" fill="#FFD700"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="165" cy="90" r="1" fill="#7ED957"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="80" r="1" fill="#FFD700"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="65" r="1.5" fill="#3FA34D"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Ambient glow orb center -->
  <ellipse cx="450" cy="100" rx="200" ry="80" fill="#0B3D2E" opacity="0.25"/>
  <ellipse cx="450" cy="100" rx="100" ry="40" fill="#3FA34D" opacity="0.08"/>

  <!-- Left tree silhouette -->
  <g opacity="0.35" fill="#0B3D2E">
    <rect x="60" y="120" width="6" height="80"/>
    <rect x="30" y="70" width="4" height="60" transform="rotate(-20 30 70)"/>
    <rect x="80" y="55" width="3" height="50" transform="rotate(15 80 55)"/>
    <ellipse cx="63" cy="70" rx="35" ry="50"/>
    <ellipse cx="30" cy="50" rx="22" ry="32"/>
    <ellipse cx="95" cy="48" rx="20" ry="28"/>
  </g>

  <!-- Right tree silhouette -->
  <g opacity="0.35" fill="#0B3D2E">
    <rect x="834" y="120" width="6" height="80"/>
    <rect x="860" y="70" width="4" height="60" transform="rotate(20 860 70)"/>
    <rect x="818" y="55" width="3" height="50" transform="rotate(-15 818 55)"/>
    <ellipse cx="837" cy="70" rx="35" ry="50"/>
    <ellipse cx="870" cy="50" rx="22" ry="32"/>
    <ellipse cx="802" cy="48" rx="20" ry="28"/>
  </g>

  <!-- Ground roots -->
  <g stroke="#3FA34D" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M450,180 Q350,185 280,200"/>
    <path d="M450,180 Q380,188 320,200"/>
    <path d="M450,180 Q500,185 560,200"/>
    <path d="M450,180 Q530,188 590,200"/>
    <path d="M450,180 Q420,183 390,195 Q360,200 340,200"/>
    <path d="M450,180 Q480,183 510,195 Q540,200 570,200"/>
  </g>

  <!-- Floating code symbols left -->
  <g font-family="monospace" font-size="11" fill="#3FA34D" opacity="0.3">
    <text x="110" y="145"><animate attributeName="y" values="145;138;145" dur="3s" repeatCount="indefinite"/>{ }</text>
    <text x="165" y="160"><animate attributeName="y" values="160;153;160" dur="3.5s" repeatCount="indefinite">&lt;/&gt;</text>
    <text x="90" y="168"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>fn()</text>
  </g>

  <!-- Floating code symbols right -->
  <g font-family="monospace" font-size="11" fill="#3FA34D" opacity="0.3">
    <text x="700" y="145"><animate attributeName="y" values="145;138;145" dur="2.8s" repeatCount="indefinite"/>===</text>
    <text x="740" y="160"><animate attributeName="y" values="160;153;160" dur="3.2s" repeatCount="indefinite">[ ]</text>
    <text x="695" y="172"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.8s" repeatCount="indefinite">API</text>
  </g>

  <!-- Central tree trunk -->
  <g filter="url(#softGlow)">
    <rect x="444" y="110" width="12" height="90" rx="4" fill="#7A4E2D" opacity="0.8"/>
    <rect x="446" y="115" width="3" height="80" rx="1" fill="#3B2A1F" opacity="0.5"/>
  </g>

  <!-- Tree branches -->
  <g stroke="#7A4E2D" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M450,130 Q420,115 405,100"/>
    <path d="M450,125 Q480,108 498,95"/>
    <path d="M450,145 Q415,140 398,130"/>
    <path d="M450,145 Q485,140 502,128"/>
    <path d="M405,100 Q390,88 378,80"/>
    <path d="M498,95 Q510,83 522,76"/>
  </g>

  <!-- Glowing leaves on branches -->
  <g fill="#3FA34D" filter="url(#glow)">
    <use href="#leaf" transform="translate(378,76) scale(1.2)"><animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/></use>
    <use href="#leaf" transform="translate(370,82) scale(0.9)"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/></use>
    <use href="#leaf" transform="translate(522,72) scale(1.2)"><animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/></use>
    <use href="#leaf" transform="translate(530,78) scale(0.9)"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.3s" repeatCount="indefinite"/></use>
    <use href="#leaf" transform="translate(398,127) scale(0.8)"><animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/></use>
    <use href="#leaf" transform="translate(502,125) scale(0.8)"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.7s" repeatCount="indefinite"/></use>
  </g>
  <g fill="#7ED957" filter="url(#softGlow)">
    <use href="#leaf" transform="translate(382,72) scale(0.7)"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.5s" repeatCount="indefinite"/></use>
    <use href="#leaf" transform="translate(526,68) scale(0.7)"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/></use>
  </g>

  <!-- Energy particles rising from trunk -->
  <g fill="#7ED957" opacity="0.7">
    <circle cx="450" cy="130" r="2"><animate attributeName="cy" values="130;80;130" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="445" cy="140" r="1.5"><animate attributeName="cy" values="140;90;140" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="455" cy="135" r="1"><animate attributeName="cy" values="135;85;135" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Main title text -->
  <text x="450" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#7ED957" filter="url(#glow)" letter-spacing="2">
    🌱 I AM TAMILSELVAN. I AM CODE.
  </text>

  <!-- Subtitle -->
  <text x="450" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#3FA34D" letter-spacing="1" opacity="0.9">
    "Growing ideas into intelligent solutions."
  </text>

  <!-- Role tags -->
  <text x="450" y="98" text-anchor="middle" font-family="monospace" font-size="10" fill="#7A4E2D" letter-spacing="3" opacity="0.85">
    B.Tech IT Student  ·  Java Developer  ·  Full-Stack Dev  ·  AI Enthusiast
  </text>

  <!-- Bottom roots line -->
  <line x1="0" y1="198" x2="900" y2="198" stroke="#3FA34D" stroke-width="1" opacity="0.3"/>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#3FA34D" opacity="0.1">
    <animate attributeName="y" values="0;200;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.15;0.05" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
